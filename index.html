<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>TEST — Sync Check</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0B1B36; color: #fff; overflow: hidden; }
  .app { display: flex; height: 100vh; width: 100vw; position: relative; }

  /* ───── COVER ───── */
  .cover { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0E2244 0%, #07142A 60%, #04101F 100%); padding: 24px;
    transition: opacity 0.4s ease, transform 0.4s ease; }
  .cover.hidden { opacity: 0; pointer-events: none; transform: scale(0.96); }
  .cover-bg { position: absolute; inset: 0; overflow: hidden; opacity: 0.18; pointer-events: none;
    background-image: linear-gradient(rgba(201,169,97,0.18) 1px, transparent 1px), linear-gradient(90deg, rgba(201,169,97,0.18) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%); }
  .cover-content { position: relative; z-index: 2; text-align: center; max-width: 980px; width: 100%; }
  .cover-title { font-size: 52px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.05; color: #fff; margin-bottom: 14px; }
  .cover-subtitle { font-size: 14px; color: #C9A961; letter-spacing: 5px; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
  .cover-tag { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 40px; }

  .meeting-bubble { width: 300px; margin: 0 auto; padding: 28px 22px; cursor: pointer; position: relative; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
    border: 1px solid rgba(201,169,97,0.35); border-radius: 14px; transition: all 0.25s ease; }
  .meeting-bubble:hover { border-color: #C9A961; transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,0.35); }
  .mb-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #C9A961; margin-bottom: 10px; font-weight: 700; }
  .mb-date { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .mb-meta { font-size: 12px; color: rgba(255,255,255,0.45); }
  .mb-arrow { position: absolute; right: 18px; bottom: 18px; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(201,169,97,0.15); color: #C9A961; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s ease; }
  .meeting-bubble:hover .mb-arrow { background: #C9A961; color: #0B1B36; }
  .cover-footer { margin-top: 40px; font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 2px; text-transform: uppercase; }
  .cover-footer span { color: #C9A961; }

  /* ───── VIEW ───── */
  .briefing-view { display: none; flex: 1; flex-direction: column; height: 100vh; width: 100vw; background: #0B1B36; }
  .briefing-view.active { display: flex; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid rgba(201,169,97,0.25); background: rgba(4,16,31,0.6); }
  .topbar .left { display: flex; align-items: center; gap: 14px; }
  .back-btn { background: transparent; border: 1px solid rgba(201,169,97,0.5); color: #C9A961; font-family: inherit;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  .back-btn:hover { background: #C9A961; color: #0B1B36; }
  .topbar h2 { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .save-state { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.6); }
  .save-dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.3); flex: none; }

  .canvas { flex: 1; overflow-y: auto; padding: 28px 22px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(201,169,97,0.2); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
  .card h3 { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #C9A961; margin-bottom: 14px; font-weight: 700; }

  .name-row { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .name-row label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  input[type=text], textarea { font-family: inherit; color: #fff; background: rgba(0,0,0,0.25);
    border: 1px solid rgba(201,169,97,0.3); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  input[type=text] { width: 200px; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: #C9A961; }
  textarea { width: 100%; min-height: 180px; line-height: 1.6; resize: vertical; }

  .entry { border-left: 2px solid #C9A961; padding: 10px 0 10px 14px; margin-bottom: 16px; }
  .entry .who { font-size: 12px; font-weight: 700; color: #C9A961; margin-bottom: 2px; }
  .entry .when { font-size: 11px; color: rgba(255,255,255,0.35); margin-bottom: 6px; }
  .entry .what { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: rgba(255,255,255,0.9); }
  .empty { font-size: 13px; color: rgba(255,255,255,0.35); font-style: italic; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #C9A961; color: #0B1B36; font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .cover-title { font-size: 34px; }
    .meeting-bubble { width: 100%; max-width: 320px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- COVER -->
  <div class="cover" id="cover">
    <div class="cover-bg"></div>
    <div class="cover-content">
      <div class="cover-subtitle">Norcros · Internal</div>
      <div class="cover-title">TEST</div>
      <div class="cover-tag">Sync check — writes to its own row, nothing else is touched</div>

      <div class="meeting-bubble" data-date="test">
        <div class="mb-label">Test page</div>
        <div class="mb-date">Sync Test</div>
        <div class="mb-meta">Type here, watch it appear elsewhere</div>
        <div class="mb-arrow">→</div>
      </div>

      <div class="cover-footer">Row id · <span id="coverDoc">test_doc</span></div>
    </div>
  </div>

  <!-- VIEW -->
  <div class="briefing-view" id="view-test">
    <div class="topbar">
      <div class="left">
        <button class="back-btn" onclick="showCover()">← Back</button>
        <h2>SYNC TEST</h2>
      </div>
      <div class="save-state">
        <span class="save-dot"></span>
        <span class="save-lbl">Starting…</span>
      </div>
    </div>

    <div class="canvas">
      <div class="wrap">

        <div class="card">
          <h3>Your text</h3>
          <div class="name-row">
            <label for="authorInput">Name</label>
            <input type="text" id="authorInput" placeholder="Dion" spellcheck="false">
          </div>
          <textarea id="noteInput" placeholder="Type anything. It saves 1.5 seconds after you stop, then shows up in the other window within about 3 seconds."></textarea>
        </div>

        <div class="card">
          <h3>Everything in this row</h3>
          <div id="entryList"><div class="empty">Nothing saved yet.</div></div>
        </div>

      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
//  Same cloud code as the CEO/CIO briefings file.
//  Only DOC_ID and the header differ, so this writes to its own row.
// ══════════════════════════════════════════════════════════════

// ── Cloud backend: Supabase ──
const SUPA_URL = 'https://mgdeklhrjbbetxbohfbz.supabase.co/rest/v1/documents';
const SUPA_KEY = 'sb_publishable_Gqsd8bwzEgsQV5EFDP1kYg_0Y_wYilJ';
const SUPA_HDR = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' };
const DOC_ID = 'test_doc';
const LS_KEY = 'testDoc.v1';
const TEST_DATE = 'test';

let noteData = { byDate: {} };
let lastSyncTs = null;
let isSyncing = false;
let cloudSaveTimer = null;
let cloudEnabled = false;
let cloudLoadedOk = false;
let currentView = null;
let pollTimer = null;

// ═════════════════════════ HELPERS ═════════════════════════
function dot(color, label) {
  const view = document.querySelector('.briefing-view.active');
  if (!view) return;
  const d = view.querySelector('.save-dot');
  const l = view.querySelector('.save-lbl');
  const c = { green: '#1A7F5A', amber: '#D4720A', blue: '#1B6FE8', red: '#C0392B', grey: 'rgba(255,255,255,.3)' };
  if (d) d.style.background = c[color] || c.grey;
  if (l) l.textContent = label;
}
function formatTime(d) { return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function formatFull(d) { return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' · ' + formatTime(d); }
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getEntries(date) {
  if (!noteData.byDate[date]) noteData.byDate[date] = { entries: [] };
  return noteData.byDate[date].entries;
}
function getEntry(date, author) {
  return getEntries(date).find(e => e.author === author);
}
function updateEntry(date, author, text) {
  const entries = getEntries(date);
  let entry = entries.find(e => e.author === author);
  const now = new Date().toISOString();
  if (entry) {
    entry.text = text;
    entry.updated = now;
  } else {
    entries.push({ author, text, created: now, updated: now });
  }
}

// ═════════════════════════ MERGE ═════════════════════════
function mergeEntriesArrays(local, remote) {
  const map = new Map();
  local.forEach(e => map.set(e.author, { ...e }));
  remote.forEach(re => {
    const le = map.get(re.author);
    if (!le) { map.set(re.author, { ...re }); return; }
    const lt = new Date(le.updated || le.created || 0).getTime();
    const rt = new Date(re.updated || re.created || 0).getTime();
    map.set(re.author, rt > lt ? { ...re } : { ...le });
  });
  return [...map.values()];
}

// ═════════════════════════ STORAGE I/O ═════════════════════════
function applyData(rec) {
  if (!rec) return false;
  let incomingByDate = {};
  if (rec.byDate && typeof rec.byDate === 'object') incomingByDate = rec.byDate;

  const allDates = new Set([...Object.keys(noteData.byDate), ...Object.keys(incomingByDate)]);
  allDates.forEach(date => {
    const localE = (noteData.byDate[date] && noteData.byDate[date].entries) || [];
    const remoteE = (incomingByDate[date] && incomingByDate[date].entries) || [];
    noteData.byDate[date] = { entries: mergeEntriesArrays(localE, remoteE) };
  });

  lastSyncTs = rec.ts || new Date().toISOString();
  renderEntries();
  return true;
}

function pushToCloud() {
  const payload = { byDate: noteData.byDate, ts: new Date().toISOString() };
  try { localStorage.setItem(LS_KEY, JSON.stringify(payload)); } catch (e) {}
  lastSyncTs = payload.ts;

  if (!cloudEnabled) { dot('amber', 'Saved locally (offline)'); return; }

  dot('amber', 'Saving to cloud…');
  const row = { id: DOC_ID, html: JSON.stringify({ byDate: noteData.byDate }), ts: payload.ts, header: 'TEST' };
  fetch(SUPA_URL + '?on_conflict=id', {
    method: 'POST',
    headers: Object.assign({}, SUPA_HDR, { 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(row)
  })
    .then(r => {
      if (r.ok) {
        dot('green', 'Auto-saved ✓');
        setTimeout(() => dot('grey', 'Live · syncing'), 1500);
      } else {
        dot('red', '⚠ Cloud save failed (' + r.status + ')');
      }
    })
    .catch(() => { dot('red', '⚠ Saved locally only'); });
}

async function pollForChanges() {
  if (isSyncing || !cloudEnabled) return;
  isSyncing = true;
  try {
    const res = await fetch(SUPA_URL + '?id=eq.' + DOC_ID + '&select=html,ts', { headers: SUPA_HDR, cache: 'no-store' });
    if (!res.ok) { isSyncing = false; return; }
    const rows = await res.json();
    if (rows && rows.length && rows[0].html) {
      const remoteTs = rows[0].ts ? new Date(rows[0].ts).getTime() : 0;
      const myTs = lastSyncTs ? new Date(lastSyncTs).getTime() : 0;
      if (remoteTs > myTs) {
        let rec; try { rec = JSON.parse(rows[0].html); } catch (e) { rec = null; }
        if (rec) { rec.ts = rows[0].ts; applyData(rec); lastSyncTs = rows[0].ts; }
      }
    }
  } catch (e) {}
  isSyncing = false;
}

// ═════════════════════════ RENDER ═════════════════════════
function renderEntries() {
  const list = document.getElementById('entryList');
  const entries = getEntries(TEST_DATE).filter(e => e.text && e.text.trim());
  if (!entries.length) { list.innerHTML = '<div class="empty">Nothing saved yet.</div>'; return; }
  list.innerHTML = entries
    .sort((a, b) => new Date(b.updated || 0) - new Date(a.updated || 0))
    .map(e => '<div class="entry">' +
      '<div class="who">' + escapeHtml(e.author) + '</div>' +
      '<div class="when">' + formatFull(new Date(e.updated || e.created)) + '</div>' +
      '<div class="what">' + escapeHtml(e.text) + '</div>' +
      '</div>').join('');

  // keep my own box in step without stealing the caret
  const ta = document.getElementById('noteInput');
  if (document.activeElement !== ta) {
    const mine = getEntry(TEST_DATE, me());
    const text = mine ? (mine.text || '') : '';
    if (ta.value !== text) ta.value = text;
  }
}

function me() {
  return (document.getElementById('authorInput').value || '').trim() || 'Anonymous';
}

// ═════════════════════════ NAV ═════════════════════════
function showCover() {
  document.getElementById('cover').classList.remove('hidden');
  document.querySelectorAll('.briefing-view').forEach(v => v.classList.remove('active'));
  currentView = null;
}
function showView() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('view-test').classList.add('active');
  currentView = TEST_DATE;
  dot('grey', 'Live · syncing');
  renderEntries();
  pollForChanges();
}

// ═════════════════════════ INPUT ═════════════════════════
function onTextInput() {
  updateEntry(TEST_DATE, me(), document.getElementById('noteInput').value);
  dot('amber', 'Typing…');
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(pushToCloud, 1500);
}

// ═════════════════════════ INIT ═════════════════════════
(async function init() {
  document.getElementById('coverDoc').textContent = DOC_ID;

  const savedName = localStorage.getItem(LS_KEY + '.name') || '';
  document.getElementById('authorInput').value = savedName;

  cloudEnabled = true;

  // Read the cloud first. On a successful first read the cloud is authoritative —
  // starting from an empty local set is what stops a stale copy pushing back over it.
  try {
    const res = await fetch(SUPA_URL + '?id=eq.' + DOC_ID + '&select=html,ts', { headers: SUPA_HDR, cache: 'no-store' });
    if (res.ok) {
      const rows = await res.json();
      if (rows && rows.length && rows[0].html) {
        let rec; try { rec = JSON.parse(rows[0].html); } catch (e) { rec = null; }
        if (rec) {
          rec.ts = rows[0].ts;
          noteData.byDate = {};
          applyData(rec);
          cloudLoadedOk = true;
        }
      } else {
        cloudLoadedOk = true;   // row doesn't exist yet — it gets created on first save
      }
    } else {
      dot('red', '⚠ Cloud read failed (' + res.status + ')');
    }
  } catch (e) {
    dot('red', '⚠ Cloud unreachable');
  }

  if (!cloudLoadedOk) {
    try {
      const local = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      if (local) applyData(local);
    } catch (e) {}
  }

  renderEntries();

  // wire up
  document.querySelector('.meeting-bubble').addEventListener('click', showView);
  document.getElementById('noteInput').addEventListener('input', onTextInput);
  document.getElementById('authorInput').addEventListener('input', function () {
    localStorage.setItem(LS_KEY + '.name', this.value);
    renderEntries();
  });

  window.addEventListener('beforeunload', () => {
    if (cloudSaveTimer) { clearTimeout(cloudSaveTimer); pushToCloud(); }
  });

  function startPolling() { if (!pollTimer) pollTimer = setInterval(pollForChanges, 3000); }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
  if (cloudEnabled && !document.hidden) startPolling();
  document.addEventListener('visibilitychange', () => {
    if (!cloudEnabled) return;
    if (document.hidden) stopPolling();
    else { pollForChanges(); startPolling(); }
  });
  window.addEventListener('focus', () => { if (cloudEnabled) pollForChanges(); });
})();
</script>
</body></html>
